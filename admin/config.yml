# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: saiferlab-cyber/saiferlab-cyber.github.io
  branch: main
  auth_scope: public_repo

site_url: https://saiferlab-cyber.github.io
display_url: https://saiferlab-cyber.github.io

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: site-settings
    label: Site Settings
    files:
      - name: general
        label: General Information
        file: _data/site.yml
        fields:
          - { label: Lab name, name: lab_name, widget: string }
          - { label: Unit name, name: unit_name, widget: string }
          - { label: Hero eyebrow, name: eyebrow, widget: string }
          - { label: Hero headline, name: headline, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Contact email, name: email, widget: string }
          - { label: Location, name: location, widget: string }
          - { label: GitHub URL, name: github_url, widget: string }
          - { label: Institutional URL, name: external_url, widget: string, required: false }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About Us
        file: about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Layout, name: layout, widget: hidden, default: page }
          - { label: Page kind, name: page_kind, widget: hidden, default: about }
          - { label: Content, name: body, widget: richtext }
      - name: rules
        label: Rules
        file: rules.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Layout, name: layout, widget: hidden, default: page }
          - { label: Page kind, name: page_kind, widget: hidden, default: rules }
          - { label: Content, name: body, widget: richtext }

  - name: research-data
    label: Macroareas
    files:
      - name: research-areas
        label: Macroareas
        file: _data/research.yml
        fields:
          - label: Macroareas
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: ID, name: id, widget: string, hint: "Lowercase identifier, e.g. malware-analysis" }
              - { label: Name, name: name, widget: string }
              - { label: Short name, name: short, widget: string }
              - { label: Lucide icon, name: icon, widget: string, default: shield }
              - { label: Color, name: color, widget: select, options: [cyan, lime, violet, amber, coral, blue] }
              - { label: Description, name: description, widget: text }

  - name: theses
    label: Thesis
    label_singular: Thesis topic
    folder: _theses
    create: true
    delete: true
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    preview_path: "thesis/{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Supervisor, name: supervisor, widget: string }
      - label: Macroarea
        name: macroarea
        widget: select
        options:
          - { label: AI for Cybersecurity, value: ai-security }
          - { label: Malware Analysis, value: malware-analysis }
          - { label: Digital Forensics, value: digital-forensics }
          - { label: Information Hiding, value: information-hiding }
          - { label: Software Supply Chain, value: supply-chain }
          - { label: Critical Systems Security, value: critical-systems }
      - { label: Degree level, name: degree_level, widget: select, options: ["Bachelor's", "Master's"], default: "Master's" }
      - { label: Approach, name: approach, widget: select, options: [Experimental, Literature review], default: Experimental }
      - { label: External link, name: link, widget: string, required: false }
      - { label: Contact email, name: email, widget: string, required: false }
      - { label: Summary, name: summary, widget: text }
      - { label: Full description, name: body, widget: richtext }
