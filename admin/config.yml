# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: saiferlab-cyber/saiferlab-cyber.github.io
  branch: main
  auth_scope: public_repo

site_url: https://saiferlab-cyber.github.io
display_url: https://saiferlab-cyber.github.io

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: site-settings
    label: Site Settings
    files:
      - name: general
        label: General Information
        file: _data/site.yml
        fields:
          - { label: Lab name, name: lab_name, widget: string }
          - { label: Unit name, name: unit_name, widget: string }
          - { label: Hero eyebrow, name: eyebrow, widget: string }
          - { label: Hero headline, name: headline, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Primary contact email, name: primary-email, widget: string }
          - { label: Secondary contact email, name: secondary-email, widget: string, required: false }
          - { label: Location, name: location, widget: string }
          - { label: GitHub URL, name: github_url, widget: string }
          - { label: Institutional URL, name: external_url, widget: string, required: false }

  - name: pages
    label: Pages
    files:
      - name: about
        label: About Us
        file: about.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Layout, name: layout, widget: hidden, default: page }
          - { label: Page kind, name: page_kind, widget: hidden, default: about }
          - { label: Content, name: body, widget: richtext }
      - name: rules
        label: Rules
        file: rules.md
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Layout, name: layout, widget: hidden, default: page }
          - { label: Page kind, name: page_kind, widget: hidden, default: rules }
          - { label: Content, name: body, widget: richtext }

  - name: team-data
    label: Team
    files:
      - name: team
        label: Team members
        file: _data/team.yml
        fields:
          - label: Professors
            name: professors
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Name and surname, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Photo, name: photo, widget: image, required: false }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
              - { label: GitHub URL, name: github, widget: string, required: false }
              - { label: ORCID URL, name: orcid, widget: string, required: false, hint: "Use the full profile URL, e.g. https://orcid.org/0000-0000-0000-0000" }
          - label: Researchers
            name: researchers
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Name and surname, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Photo, name: photo, widget: image, required: false }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
              - { label: GitHub URL, name: github, widget: string, required: false }
              - { label: ORCID URL, name: orcid, widget: string, required: false, hint: "Use the full profile URL, e.g. https://orcid.org/0000-0000-0000-0000" }
          - label: PhD students
            name: phd_students
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Name and surname, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Photo, name: photo, widget: image, required: false }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
              - { label: GitHub URL, name: github, widget: string, required: false }
              - { label: ORCID URL, name: orcid, widget: string, required: false, hint: "Use the full profile URL, e.g. https://orcid.org/0000-0000-0000-0000" }

  - name: research-data
    label: Macroareas
    files:
      - name: research-areas
        label: Macroareas
        file: _data/research.yml
        fields:
          - label: Macroareas
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: ID, name: id, widget: string, hint: "Lowercase identifier, e.g. malware-analysis" }
              - { label: Name, name: name, widget: string }
              - { label: Short name, name: short, widget: string }
              - { label: Lucide icon, name: icon, widget: string, default: shield }
              - { label: Color, name: color, widget: select, options: [cyan, lime, violet, amber, coral, blue] }
              - { label: Description, name: description, widget: text }

  - name: thesis-data
    label: Thesis
    files:
      - name: thesis-topics
        label: Thesis topics
        file: _data/theses.yml
        fields:
          - label: Topics
            name: items
            widget: list
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { label: ID, name: slug, widget: string, hint: "Unique lowercase ID with hyphens, e.g. android-malware-analysis" }
              - { label: Title, name: title, widget: string }
              - { label: Status, name: status, widget: select, options: [{ label: "Available", value: available }, { label: "Assigned / Ongoing", value: taken }, { label: "Completed", value: completed }], default: available, hint: "Change this field to move the thesis automatically between the three sections." }
              - { label: Supervisor, name: supervisor, widget: string }
              - { label: Tutor, name: tutor, widget: string, required: false, hint: "Operational point of contact for the student" }
              - { label: Macroarea ID, name: macroarea, widget: string, hint: "Use the ID configured under Macroareas, e.g. malware-analysis" }
              - { label: Degree level, name: degree_level, widget: select, options: ["Bachelor's", "Master's"], default: "Master's" }
              - { label: Approach, name: approach, widget: select, options: [Experimental, Literature review], default: Experimental }
              - { label: More details link, name: link, widget: string, required: false }
              - { label: Contact email, name: email, widget: string, required: false }
              - { label: Abstract, name: abstract, widget: text }
              - { label: Student, name: student, widget: string, required: false, hint: "Useful for assigned or completed theses" }
              - { label: Completion year, name: completion_year, widget: number, value_type: int, required: false }
              - { label: Related paper URL, name: paper_link, widget: string, required: false, hint: "Add the paper or publication link when available" }
