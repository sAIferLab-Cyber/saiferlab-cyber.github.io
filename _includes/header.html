<header class="site-header" data-header>
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.site.lab_name }} home">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span class="brand-copy">
        <strong>{{ site.data.site.lab_name }}</strong>
        <small>{{ site.data.site.unit_name }}</small>
      </span>
    </a>

    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false" data-menu-toggle>
      <i data-lucide="menu"></i>
    </button>

    <nav class="site-nav" aria-label="Primary navigation" data-menu>
      <a href="{{ '/#research' | relative_url }}">Research</a>
      <a href="{{ '/#projects' | relative_url }}">Projects</a>
      <a href="{{ '/#opportunities' | relative_url }}">Opportunities</a>
      {% if site.people.size > 0 %}<a href="{{ '/#people' | relative_url }}">People</a>{% endif %}
      <a class="nav-admin" href="{{ '/admin/' | relative_url }}"><i data-lucide="square-pen"></i> Admin</a>
    </nav>
  </div>
</header>
