items:
  - id: malware-analysis
    name: Malware Analysis
    short: Malware
    icon: bug
    color: lime
    description: With the rise of sophisticated malware, the need for advanced detection methods became evident. Early research in the late 1990s and early 2000s focused on signature-based detection. However, as malware evolved, these methods became less effective. Breakthroughs in machine learning and behavioral analysis have led to the development of more dynamic and adaptive malware detection systems.
  - id: digital-forensics
    name: Digital Forensics
    short: Forensics
    icon: scan-search
    color: violet
    description: Understanding the vulnerabilities that allowed a threat actor to succeed in attacking a system requires collecting and correlating data from multiple sources such as logs, program traces, etc. Advanced tools for analyzing binary codes, system memory, files, and execution traces have been developed to get an in-depth understanding of the threats and plan prevention, detection, and response actions.
  - id: cyber-threat-intelligence
    name: Cyber Threat Intelligence
    short: CTI
    icon: shield
    color: lime
    description: Analysis of data and cyber threats to understand how cyber attacks work, evolve, and their attribution
  - id: web-security
    name: Web Security
    short: WebSec
    icon: globe-check
    color: coral
    description: Web security is the practice of protecting websites, web applications, and online services from cyber threats and attacks. It involves implementing measures to safeguard against vulnerabilities, unauthorized access, data breaches, and other malicious activities that can compromise the integrity, confidentiality, and availability of web-based resources.
  - id: vulnerability-assessment
    name: Vulnerability Assessment
    short: VA
    icon: shield
    color: violet
    description: Vulnerability assessment is the process of identifying, quantifying, and prioritizing vulnerabilities in a system. It involves scanning systems for known vulnerabilities, analyzing the potential impact of those vulnerabilities, and recommending mitigation strategies. This proactive approach helps organizations strengthen their security posture and reduce the risk of exploitation by malicious actors.
  - id: software-security
    name: Software Security
    short: SoftSec
    icon: shield
    color: violet
    description: Ensuring the security of software applications and systems through secure coding practices, code reviews, and penetration testing.
